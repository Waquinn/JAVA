<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Receipt Printing Animation</title>
  <style>
    body {
      background-color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    .container {
      position: relative;
      width: 220px;
      height: 350px;
      margin-bottom: 20px;
    }

    .printer {
      background: #333;
      width: 230px;
      height: 40px;
      border-radius: 5px 5px 0 0;
      position: absolute;
      top: 0;
      z-index: 2;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .receipt {
      width: 200px;
      height: 300px;
      background: white;
      position: absolute;
      top: 40px;
      left: 6px;
      z-index: 1;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      font-family: monospace;
      font-size: 14px;
      border-radius: 0 0 5px 5px;
      transform: translateY(-300px);
      opacity: 0;
      animation: print 3s ease-out forwards;
    }

    @keyframes print {
      0% {
        transform: translateY(-300px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .receipt-content {
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 3s; /* Wait for paper to "print" first */
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    .receipt::after {
      content: "";
      display: block;
      margin-top: 10px;
      border-top: 2px dashed #ccc;
    }

    button {
      padding: 10px 20px;
      font-size: 14px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="printer"></div>
    <div class="receipt" id="receipt">
      <div class="receipt-content" id="receipt-content">
        <strong>Store Name</strong><br>
        ----------------------<br>
        Item A .......... $5.00<br>
        Item B .......... $3.00<br>
        Tax ............. $0.80<br>
        ----------------------<br>
        Total ........... $8.80<br>
        <br>
        Thank you! 😊
      </div>
    </div>
  </div>
  <button onclick="reprint()">Print Again</button>

  <script>
    function reprint() {
      const receipt = document.getElementById('receipt');
      const content = document.getElementById('receipt-content');

      // Reset animations
      receipt.style.animation = 'none';
      content.style.animation = 'none';
      content.style.opacity = '0';

      // Force reflow
      void receipt.offsetWidth;

      // Restart animations
      receipt.style.animation = 'print 3s ease-out forwards';
      content.style.animation = 'fadeIn 1s ease forwards';
      content.style.animationDelay = '3s'; // Match receipt duration
    }
  </script>
</body>
</html>
