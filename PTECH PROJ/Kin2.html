<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Kin's Parking 🚗</title>
    <style>
        :root {
            --pink: #FFD1DC;
            --lavender: #E6E6FA;
            --mint: #B5EAD7;
            --peach: #FFDAC1;
            --text: #5A5A5A;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #FFF9FB;
            color: var(--text);
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #FF85A2;
            margin-bottom: 5px;
            font-size: 2.2em;
        }

        .subtitle {
            color: #A2A2A2;
            margin-bottom: 25px;
        }

        .parking-lot {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 30px 0;
        }

        .parking-spot {
            height: 80px;
            background-color: var(--lavender);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            border: 2px dashed #DCD0FF;
            position: relative;
        }

        .parking-spot.occupied {
            background-color: var(--peach);
            border: 2px solid #FFB7B2;
        }

        .spot-number {
            font-size: 12px;
            color: #888;
            position: absolute;
            top: 5px;
            left: 5px;
        }

        .car-emoji {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .license-plate {
            font-size: 10px;
            background-color: white;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: monospace;
        }

        .controls {
            background-color: var(--mint);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        input, button {
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            margin: 5px;
            font-family: 'Nunito', sans-serif;
        }

        input {
            width: 150px;
            text-align: center;
            border: 1px solid #D1D1D1;
        }

        button {
            background-color: #FF85A2;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #FF6B8B;
            transform: translateY(-2px);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            background-color: var(--pink);
            padding: 15px;
            border-radius: 12px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            color: #FF85A2;
            font-weight: bold;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #B5EAD7;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transform: translateX(200%);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Kin's Parking</h1>
    <div class="subtitle">A parking management system</div>

    <div class="parking-lot" id="parkingLot">
        <!-- Parking spots will be generated by JS -->
    </div>

    <div class="controls">
        <input type="text" id="licenseInput" placeholder="Enter license plate" maxlength="7">
        <button id="parkBtn">Park Vehicle</button>
        <button id="unparkBtn">Unpark Vehicle</button>
    </div>

    <div class="stats">
        <div class="stat-box">
            <div class="stat-number" id="totalSpots">20</div>
            <div>Total Spots</div>
        </div>
        <div class="stat-box">
            <div class="stat-number" id="availableSpots">20</div>
            <div>Available</div>
        </div>
        <div class="stat-box">
            <div class="stat-number" id="occupiedSpots">0</div>
            <div>Occupied</div>
        </div>
    </div>

    <div class="notification" id="notification">
        Notification message here
    </div>

    <script>
        // Parking system variables
        const parkingSpots = Array(20).fill(null);
        const carEmojis = ['🚗', '🚙', '🚕', '🚌', '🏎️', '🚓', '🚑', '🚚', '🚛', '🚜'];
        const parkingLot = document.getElementById('parkingLot');
        const licenseInput = document.getElementById('licenseInput');
        const parkBtn = document.getElementById('parkBtn');
        const unparkBtn = document.getElementById('unparkBtn');
        const totalSpots = document.getElementById('totalSpots');
        const availableSpots = document.getElementById('availableSpots');
        const occupiedSpots = document.getElementById('occupiedSpots');
        const notification = document.getElementById('notification');

        // Initialize parking lot
        function initParkingLot() {
            parkingLot.innerHTML = '';
            parkingSpots.forEach((spot, index) => {
                const spotElement = document.createElement('div');
                spotElement.className = 'parking-spot';
                spotElement.dataset.spotNumber = index + 1;
                
                const spotNumber = document.createElement('div');
                spotNumber.className = 'spot-number';
                spotNumber.textContent = index + 1;
                
                spotElement.appendChild(spotNumber);
                
                if (spot) {
                    spotElement.classList.add('occupied');
                    const carEmoji = document.createElement('div');
                    carEmoji.className = 'car-emoji';
                    carEmoji.textContent = spot.emoji;
                    
                    const licensePlate = document.createElement('div');
                    licensePlate.className = 'license-plate';
                    licensePlate.textContent = spot.license;
                    
                    spotElement.appendChild(carEmoji);
                    spotElement.appendChild(licensePlate);
                }
                
                parkingLot.appendChild(spotElement);
            });
            
            updateStats();
        }

        // Park a vehicle
        function parkVehicle() {
            const license = licenseInput.value.trim().toUpperCase();
            
            if (!license) {
                showNotification('Please enter a license plate');
                return;
            }
            
            const emptySpotIndex = parkingSpots.findIndex(spot => spot === null);
            
            if (emptySpotIndex === -1) {
                showNotification('Parking lot is full!');
                return;
            }
            
            const randomEmoji = carEmojis[Math.floor(Math.random() * carEmojis.length)];
            parkingSpots[emptySpotIndex] = {
                license: license,
                emoji: randomEmoji
            };
            
            licenseInput.value = '';
            initParkingLot();
            showNotification(`Vehicle parked in spot ${emptySpotIndex + 1}`);
        }

        // Unpark a vehicle
        function unparkVehicle() {
            const license = licenseInput.value.trim().toUpperCase();
            
            if (!license) {
                showNotification('Please enter a license plate');
                return;
            }
            
            const spotIndex = parkingSpots.findIndex(spot => spot && spot.license === license);
            
            if (spotIndex === -1) {
                showNotification('Vehicle not found in parking lot');
                return;
            }
            
            parkingSpots[spotIndex] = null;
            licenseInput.value = '';
            initParkingLot();
            showNotification(`Vehicle ${license} has left spot ${spotIndex + 1}`);
        }

        // Update statistics
        function updateStats() {
            const total = parkingSpots.length;
            const occupied = parkingSpots.filter(spot => spot !== null).length;
            const available = total - occupied;
            
            occupiedSpots.textContent = occupied;
            availableSpots.textContent = available;
        }

        // Show notification
        function showNotification(message) {
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Event listeners
        parkBtn.addEventListener('click', parkVehicle);
        unparkBtn.addEventListener('click', unparkVehicle);
        licenseInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                parkVehicle();
            }
        });

        // Initialize
        initParkingLot();
    </script>
</body>
</html>
